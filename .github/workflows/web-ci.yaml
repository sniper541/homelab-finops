name: Web CI

on:
  push:
    branches:
      - main
    paths:
      - "applications/web/**"
      - "infrastructure/argocd/finops-web.yaml"
      - ".github/workflows/web-ci.yaml"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/finops-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: applications/web
        run: npm ci

      - name: Run tests
        working-directory: applications/web
        run: npm test

      - name: Build web app
        working-directory: applications/web
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.sniper541.com
          VITE_USER_ID: "1"
          VITE_REGISTRATION_ENABLED: ${{ vars.FINOPS_REGISTRATION_ENABLED || 'false' }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: applications/web
          push: true
          build-args: |
            VITE_API_BASE_URL=https://api.sniper541.com
            VITE_USER_ID=1
            VITE_REGISTRATION_ENABLED=${{ vars.FINOPS_REGISTRATION_ENABLED || 'false' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Scan web image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate web SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx
          output: finops-web-sbom.cdx.json

      - name: Upload web SBOM
        uses: actions/upload-artifact@v4
        with:
          name: finops-web-sbom-${{ github.sha }}
          path: finops-web-sbom.cdx.json
          retention-days: 30

      - name: Update Kubernetes image
        run: |
          sed -i \
            "s|image: ghcr.io/sniper541/homelab-finops/finops-web:.*|image: ghcr.io/sniper541/homelab-finops/finops-web:${GITHUB_SHA}|" \
            applications/web/deployment.yaml

      - name: Commit updated image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add applications/web/deployment.yaml

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Update web image to ${GITHUB_SHA}"

          git pull --rebase origin main
          git push origin main
