name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "applications/backend/**"
      - ".github/workflows/backend-ci.yaml"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sniper541/finops-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finops_test
          POSTGRES_USER: finops_test
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finops_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: finops_test
      POSTGRES_USER: finops_test
      POSTGRES_PASSWORD: ci-test-only

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            applications/backend/requirements.txt
            applications/backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: applications/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: applications/backend
        run: |
          pytest -v

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.0

      - name: Build and push backend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./applications/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          timeout: 15m
          image-ref: ghcr.io/sniper541/finops-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          timeout: 15m
          image-ref: ghcr.io/sniper541/finops-api:${{ github.sha }}
          format: cyclonedx
          output: finops-api-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: finops-api-sbom-${{ github.sha }}
          path: finops-api-sbom.cdx.json
          retention-days: 30

      - name: Update image version in Kubernetes manifest
        run: |
          sed -i \
            "s#image: ghcr.io/sniper541/finops-api:.*#image: ghcr.io/sniper541/finops-api:${GITHUB_SHA}#" \
            applications/backend/deployment.yaml

      - name: Commit new image version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add applications/backend/deployment.yaml

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Deploy finops-api ${GITHUB_SHA}"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep 3
          done
          exit 1
