name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "applications/backend/**"
      - ".github/workflows/backend-ci.yaml"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sniper541/finops-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            applications/backend/requirements.txt
            applications/backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: applications/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: applications/backend
        run: |
          pytest -v

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./applications/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/sniper541/finops-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/sniper541/finops-api:${{ github.sha }}
          format: cyclonedx
          output: finops-api-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: finops-api-sbom-${{ github.sha }}
          path: finops-api-sbom.cdx.json
          retention-days: 30

      - name: Update image version in Kubernetes manifest
        run: |
          sed -i \
            "s#image: ghcr.io/sniper541/finops-api:.*#image: ghcr.io/sniper541/finops-api:${GITHUB_SHA}#" \
            applications/backend/deployment.yaml

      - name: Commit new image version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add applications/backend/deployment.yaml

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Deploy finops-api ${GITHUB_SHA}"

          git pull --rebase origin main
          git push origin main
