name: Bot CI

on:
  push:
    branches:
      - main
    paths:
      - "applications/bot/**"
      - ".github/workflows/bot-ci.yaml"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: applications/bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        working-directory: applications/bot
        run: |
          python -m py_compile app/main.py

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.0

      - name: Build and push bot image
        uses: docker/build-push-action@v7.4.0
        with:
          context: applications/bot
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/finops-bot:${{ github.sha }}
            ghcr.io/${{ github.repository }}/finops-bot:latest

      - name: Scan bot image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          timeout: 15m
          image-ref: ghcr.io/${{ github.repository }}/finops-bot:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate bot SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          timeout: 15m
          image-ref: ghcr.io/${{ github.repository }}/finops-bot:${{ github.sha }}
          format: cyclonedx
          output: finops-bot-sbom.cdx.json

      - name: Upload bot SBOM
        uses: actions/upload-artifact@v7.0.1
        with:
          name: finops-bot-sbom-${{ github.sha }}
          path: finops-bot-sbom.cdx.json
          retention-days: 30

      - name: Build and push proxy image
        uses: docker/build-push-action@v7.4.0
        with:
          context: applications/bot
          file: applications/bot/Dockerfile.proxy
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/finops-ssh-proxy:${{ github.sha }}
            ghcr.io/${{ github.repository }}/finops-ssh-proxy:latest

      - name: Scan proxy image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          timeout: 15m
          image-ref: ghcr.io/${{ github.repository }}/finops-ssh-proxy:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate proxy SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          timeout: 15m
          image-ref: ghcr.io/${{ github.repository }}/finops-ssh-proxy:${{ github.sha }}
          format: cyclonedx
          output: finops-ssh-proxy-sbom.cdx.json

      - name: Upload proxy SBOM
        uses: actions/upload-artifact@v7.0.1
        with:
          name: finops-ssh-proxy-sbom-${{ github.sha }}
          path: finops-ssh-proxy-sbom.cdx.json
          retention-days: 30

      - name: Update Kubernetes images
        run: |
          sed -i \
            "s|image: ghcr.io/sniper541/homelab-finops/finops-bot:.*|image: ghcr.io/sniper541/homelab-finops/finops-bot:${GITHUB_SHA}|" \
            applications/bot/deployment.yaml

          sed -i \
            "s|image: ghcr.io/sniper541/homelab-finops/finops-ssh-proxy:.*|image: ghcr.io/sniper541/homelab-finops/finops-ssh-proxy:${GITHUB_SHA}|" \
            applications/bot/deployment.yaml


      - name: Commit updated image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add applications/bot/deployment.yaml

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Update bot images to ${GITHUB_SHA}"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep 3
          done
          exit 1
