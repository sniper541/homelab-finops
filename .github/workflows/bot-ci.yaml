name: Bot CI

on:
  push:
    branches:
      - main
    paths:
      - "applications/bot/**"
      - ".github/workflows/bot-ci.yaml"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: applications/bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        working-directory: applications/bot
        run: |
          python -m py_compile app/main.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: applications/bot
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/finops-bot:${{ github.sha }}
            ghcr.io/${{ github.repository }}/finops-bot:latest

      - name: Update Kubernetes image
        run: |
          sed -i \
            "s|image: ghcr.io/sniper541/homelab-finops/finops-bot:.*|image: ghcr.io/sniper541/homelab-finops/finops-bot:${GITHUB_SHA}|" \
            applications/bot/deployment.yaml

      - name: Commit updated image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add applications/bot/deployment.yaml

          git diff --cached --quiet || \
            git commit -m "Update bot image to ${GITHUB_SHA}"

          git push
