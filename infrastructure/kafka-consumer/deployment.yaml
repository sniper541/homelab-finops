apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
  namespace: finops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kafka-consumer

  template:
    metadata:
      labels:
        app: kafka-consumer

      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "finops-kafka-consumer"
        vault.hashicorp.com/agent-service-account-token-volume-name: "vault-auth"

        vault.hashicorp.com/agent-run-as-user: "10001"
        vault.hashicorp.com/agent-run-as-group: "10001"

        vault.hashicorp.com/agent-inject-secret-database.json: "database/creds/finops-api"
        vault.hashicorp.com/agent-inject-template-database.json: |
          {{- with secret "database/creds/finops-api" -}}
          {{ .Data | toJSON }}
          {{- end }}
        vault.hashicorp.com/agent-inject-perms-database.json: "0400"
        vault.hashicorp.com/error-on-missing-key-database.json: "true"

        vault.hashicorp.com/agent-inject-secret-kafka.json: "finops/data/kafka"
        vault.hashicorp.com/agent-inject-template-kafka.json: |
          {{- with secret "finops/data/kafka" -}}
          {"username":"{{ .Data.data.username }}","password":"{{ .Data.data.password }}"}
          {{- end }}
        vault.hashicorp.com/agent-inject-perms-kafka.json: "0400"
        vault.hashicorp.com/error-on-missing-key-kafka.json: "true"

    spec:
      serviceAccountName: kafka-consumer
      automountServiceAccountToken: false

      volumes:
        - name: vault-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault
                  expirationSeconds: 3600

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: kafka-consumer
          image: ghcr.io/sniper541/finops-kafka-consumer:192b97e90596ad17e7c74dc9a384447be0ca4c1b

          env:
            - name: POSTGRES_HOST
              value: postgres.finops.svc.cluster.local

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_DB
              value: finops

            - name: POSTGRES_CREDENTIALS_FILE
              value: /vault/secrets/database.json

            - name: KAFKA_BOOTSTRAP_SERVERS
              value: finops-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092

            - name: KAFKA_CREDENTIALS_FILE
              value: /vault/secrets/kafka.json

            - name: PYTHONDONTWRITEBYTECODE
              value: "1"

            - name: PYTHONUNBUFFERED
              value: "1"

          resources:
            requests:
              cpu: 50m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
