global:
  enabled: true

injector:
  enabled: true
  image:
    repository: hashicorp/vault-k8s
    tag: "1.7.6"
  agentImage:
    repository: hashicorp/vault
    tag: "2.0.4"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  securityContext:
    pod:
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]

server:
  image:
    repository: hashicorp/vault
    tag: "2.0.4"

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: local-path
    accessMode: ReadWriteOnce

  auditStorage:
    # Existing StatefulSet claim templates are immutable. Mount a separate PVC.
    enabled: false
  volumes:
    - name: persistent-audit
      persistentVolumeClaim:
        claimName: vault-audit
    - name: temporary-config
      emptyDir:
        medium: Memory
        sizeLimit: 32Mi
  volumeMounts:
    - name: persistent-audit
      mountPath: /vault/audit
    - name: temporary-config
      mountPath: /tmp
  statefulSet:
    securityContext:
      pod:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]

  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 1

    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
        }

        service_registration "kubernetes" {}

ui:
  enabled: true
  serviceType: ClusterIP
