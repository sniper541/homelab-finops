apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-exporter
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: monitoring
  labels:
    app: postgres-exporter
spec:
  selector:
    app: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: finops-postgres-exporter
        vault.hashicorp.com/agent-run-as-user: "65534"
        vault.hashicorp.com/agent-run-as-group: "65534"
        vault.hashicorp.com/agent-service-account-token-volume-name: vault-auth
        vault.hashicorp.com/agent-inject-secret-password: finops/data/postgres-exporter
        vault.hashicorp.com/agent-inject-perms-password: "0400"
        vault.hashicorp.com/error-on-missing-key-password: "true"
        vault.hashicorp.com/agent-inject-template-password: |
          {{- with secret "finops/data/postgres-exporter" -}}{{ .Data.data.password }}{{- end -}}
    spec:
      serviceAccountName: postgres-exporter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: vault-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault
                  expirationSeconds: 3600
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          args:
            - --collector.long_running_transactions
            - --no-collector.stat_statements
          env:
            - name: DATA_SOURCE_URI
              value: postgres.finops.svc.cluster.local:5432/finops?sslmode=disable
            - name: DATA_SOURCE_USER
              value: finops_monitor
            - name: DATA_SOURCE_PASS_FILE
              value: /vault/secrets/password
          ports:
            - name: metrics
              containerPort: 9187
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
