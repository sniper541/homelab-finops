fullnameOverride: grafana
replicas: 1
deploymentStrategy:
  type: Recreate
image:
  tag: "13.2.3"
serviceAccount:
  create: true
  name: grafana
  automountServiceAccountToken: false
automountServiceAccountToken: false
rbac:
  create: false
securityContext:
  runAsNonRoot: true
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
startupProbe:
  httpGet:
    path: /api/health
    port: 3000
  periodSeconds: 5
  failureThreshold: 120
initChownData:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi
persistence:
  enabled: true
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  size: 2Gi
env:
  GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/agent-pre-populate-only: "true"
  vault.hashicorp.com/role: finops-grafana
  vault.hashicorp.com/agent-run-as-user: "472"
  vault.hashicorp.com/agent-run-as-group: "472"
  vault.hashicorp.com/agent-service-account-token-volume-name: vault-auth
  vault.hashicorp.com/agent-inject-secret-oauth-client-secret: finops/data/grafana
  vault.hashicorp.com/agent-inject-perms-oauth-client-secret: "0400"
  vault.hashicorp.com/error-on-missing-key-oauth-client-secret: "true"
  vault.hashicorp.com/agent-inject-template-oauth-client-secret: |
    {{- with secret "finops/data/grafana" -}}{{ .Data.data.client_secret }}{{- end -}}
  vault.hashicorp.com/agent-inject-secret-secret-key: finops/data/grafana
  vault.hashicorp.com/agent-inject-perms-secret-key: "0400"
  vault.hashicorp.com/agent-inject-template-secret-key: |
    {{- with secret "finops/data/grafana" -}}{{ .Data.data.secret_key }}{{- end -}}
extraContainerVolumes:
  - name: vault-auth
    projected:
      sources:
        - serviceAccountToken:
            path: token
            audience: vault
            expirationSeconds: 3600
extraVolumeMounts:
  - name: platform-dashboards
    mountPath: /var/lib/grafana/dashboards/finops
    readOnly: true
extraVolumes:
  - name: platform-dashboards
    configMap:
      name: finops-grafana-dashboards
      defaultMode: 0444
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts: [grafana.sniper541.com]
  tls:
    - secretName: grafana-tls
      hosts: [grafana.sniper541.com]
serviceMonitor:
  enabled: true
  labels:
    release: monitoring
  interval: 30s
sidecar:
  dashboards:
    enabled: false
  datasources:
    enabled: false
testFramework:
  enabled: false
# File providers are evaluated by Grafana, never rendered as credential values in Git.
grafana.ini:
  server:
    root_url: https://grafana.sniper541.com
    domain: grafana.sniper541.com
  analytics:
    reporting_enabled: false
    check_for_updates: false
  security:
    disable_initial_admin_creation: true
    cookie_secure: true
    cookie_samesite: lax
    secret_key: $__file{/vault/secrets/secret-key}
    content_security_policy: true
  auth:
    disable_login_form: true
    oauth_auto_login: true
    signout_redirect_url: https://auth.sniper541.com/realms/finops/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgrafana.sniper541.com%2Flogin%3FdisableAutoLogin%3Dtrue
  auth.basic:
    enabled: false
  auth.anonymous:
    enabled: false
  auth.generic_oauth:
    enabled: true
    name: Keycloak
    allow_sign_up: true
    auto_login: true
    client_id: grafana
    client_secret: $__file{/vault/secrets/oauth-client-secret}
    scopes: openid profile email
    auth_url: https://auth.sniper541.com/realms/finops/protocol/openid-connect/auth
    token_url: https://auth.sniper541.com/realms/finops/protocol/openid-connect/token
    api_url: https://auth.sniper541.com/realms/finops/protocol/openid-connect/userinfo
    use_pkce: true
    use_refresh_token: true
    login_attribute_path: preferred_username
    email_attribute_path: email
    name_attribute_path: name
    role_attribute_path: "contains(grafana_roles[*], 'grafana-admin') && 'GrafanaAdmin' || 'Viewer'"
    allow_assign_grafana_admin: true
    role_attribute_strict: true
    skip_org_role_sync: false
  users:
    default_theme: dark
    viewers_can_edit: false
  dashboards:
    default_home_dashboard_path: /var/lib/grafana/dashboards/finops/platform-overview.json
  unified_alerting:
    enabled: false
  log:
    mode: console
    level: info
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 30s
          prometheusType: Prometheus
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: finops
        orgId: 1
        folder: FinOps Platform
        folderUid: finops-platform
        type: file
        disableDeletion: false
        editable: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/finops
