apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kafka-consumer
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/sniper541/homelab-finops.git
    targetRevision: main
    path: infrastructure/kafka-consumer

  destination:
    server: https://kubernetes.default.svc
    namespace: finops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
