apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  namespace: kafka
  labels:
    strimzi.io/cluster: finops-kafka
spec:
  replicas: 1

  roles:
    - controller
    - broker

  storage:
    type: persistent-claim
    size: 5Gi
    class: local-path
    deleteClaim: false

  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi

---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: finops-kafka
  namespace: kafka
spec:
  kafka:
    version: 4.3.1

    metadataVersion: "4.3-IV0"

    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512

    config:
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      auto.create.topics.enable: false

  entityOperator:
    topicOperator: {}
    userOperator: {}
