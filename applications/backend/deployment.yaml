apiVersion: apps/v1
kind: Deployment

metadata:
  name: finops-api
  namespace: finops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: finops-api

  template:
    metadata:
      labels:
        app: finops-api

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finops-api
          image: ghcr.io/sniper541/finops-api:c75462bbc3777960e64f4e039f4e92bdbf9df0ff
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: finops-api-config

            - secretRef:
                name: postgres-secret

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi
