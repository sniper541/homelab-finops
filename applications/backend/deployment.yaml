apiVersion: apps/v1
kind: Deployment

metadata:
  name: finops-api
  namespace: finops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: finops-api

  template:
    metadata:
      labels:
        app: finops-api
      annotations:
        finops.sniper541.com/auth-issuer: "https://auth.sniper541.com/realms/finops"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "finops-api"
        vault.hashicorp.com/agent-service-account-token-volume-name: "vault-auth"
        vault.hashicorp.com/agent-run-as-user: "10001"
        vault.hashicorp.com/agent-run-as-group: "10001"
        vault.hashicorp.com/agent-inject-secret-database.json: "database/creds/finops-api"
        vault.hashicorp.com/agent-inject-template-database.json: |
          {{- with secret "database/creds/finops-api" -}}
          {{ .Data | toJSON }}
          {{- end }}
        vault.hashicorp.com/agent-inject-perms-database.json: "0400"
        vault.hashicorp.com/error-on-missing-key-database.json: "true"

    spec:
      serviceAccountName: finops-api
      automountServiceAccountToken: false
      volumes:
        - name: vault-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault
                  expirationSeconds: 3600
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finops-api
          image: ghcr.io/sniper541/finops-api:530ffed58c6e12afc4368184dd1a619b551f544c
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: finops-api-config

          env:
            - name: POSTGRES_DB
              value: finops
            - name: POSTGRES_CREDENTIALS_FILE
              value: /vault/secrets/database.json

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi
