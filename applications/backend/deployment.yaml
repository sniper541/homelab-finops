apiVersion: apps/v1
kind: Deployment

metadata:
  name: finops-api
  namespace: finops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: finops-api

  template:
    metadata:
      labels:
        app: finops-api

    spec:
      containers:
        - name: finops-api
          image: ghcr.io/sniper541/finops-api:37d98b89ea8bfb2bb5ef797f6da393b5d9e66eca
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: finops-api-config

            - secretRef:
                name: postgres-secret

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi
