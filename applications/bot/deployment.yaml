apiVersion: apps/v1
kind: Deployment

metadata:
  name: finops-bot
  namespace: finops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: finops-bot

  template:
    metadata:
      labels:
        app: finops-bot

      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: "finops-bot"

        # Telegram Bot Token
        vault.hashicorp.com/agent-inject-secret-telegram-token: "finops/data/bot"
        vault.hashicorp.com/agent-inject-template-telegram-token: |
          {{- with secret "finops/data/bot" -}}
          {{ .Data.data.TELEGRAM_BOT_TOKEN }}
          {{- end }}
        vault.hashicorp.com/agent-inject-perms-telegram-token: "0440"

        # Keycloak client secret
        vault.hashicorp.com/agent-inject-secret-keycloak-client-secret: "finops/data/bot"
        vault.hashicorp.com/agent-inject-template-keycloak-client-secret: |
          {{- with secret "finops/data/bot" -}}
          {{ .Data.data.KEYCLOAK_CLIENT_SECRET }}
          {{- end }}
        vault.hashicorp.com/agent-inject-perms-keycloak-client-secret: "0440"

        # SSH private key for Telegram proxy
        vault.hashicorp.com/agent-inject-secret-id_ed25519: "finops/data/bot-proxy"
        vault.hashicorp.com/agent-inject-template-id_ed25519: |
          {{- with secret "finops/data/bot-proxy" -}}
          {{ .Data.data.id_ed25519 }}
          {{- end }}
        vault.hashicorp.com/agent-inject-perms-id_ed25519: "0440"

    spec:
      serviceAccountName: finops-bot

      securityContext:
        runAsNonRoot: true
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: finops-bot
          image: ghcr.io/sniper541/homelab-finops/finops-bot:768b376340ed513993cff565bd11916684d07963
          imagePullPolicy: Always

          command:
            - /bin/sh
            - -ec
            - |
              export TELEGRAM_BOT_TOKEN="$(cat /vault/secrets/telegram-token)"
              export KEYCLOAK_CLIENT_SECRET="$(cat /vault/secrets/keycloak-client-secret)"
              exec python app/main.py

          env:
            - name: FINOPS_API_URL
              value: "https://api.sniper541.com"

            - name: KEYCLOAK_TOKEN_URL
              value: "https://app.sniper541.com/auth/realms/finops/protocol/openid-connect/token"

            - name: TELEGRAM_PROXY_URL
              value: "socks5://127.0.0.1:1080"

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

        - name: ssh-proxy
          image: ghcr.io/sniper541/homelab-finops/finops-ssh-proxy:768b376340ed513993cff565bd11916684d07963
          imagePullPolicy: Always

          args:
            - "-N"
            - "-D"
            - "0.0.0.0:1080"
            - "-i"
            - "/vault/secrets/id_ed25519"
            - "-o"
            - "BatchMode=yes"
            - "-o"
            - "StrictHostKeyChecking=no"
            - "-o"
            - "ExitOnForwardFailure=yes"
            - "-o"
            - "ServerAliveInterval=30"
            - "-o"
            - "ServerAliveCountMax=3"
            - "finops-proxy@89.110.67.219"

          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            capabilities:
              drop:
                - ALL